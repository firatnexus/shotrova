<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%BRAND_NAME%</title>
    <meta name="description" content="%BRAND_DESC%" />
    <meta name="theme-color" content="%THEME_LIGHT%" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="%THEME_DARK%" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="%BRAND_NAME%" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/inter-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <script>
      try {
        var d = matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
      } catch (e) {}
      try {
        // Inside the Android WebView the native launch splash owns startup;
        // the PWA boot splash must never render on top of it (also set by the
        // app's main module — this early copy prevents any first-paint flash).
        if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) document.documentElement.classList.add('native');
      } catch (e) {}
    </script>
  </head>
  <body>
    <style>
      /* One voice (Contra reference, "editorial portfolio on white"): Inter
         stands in for GT Standard — tight -0.01em tracking at 15–16px body
         sizes and large 58px display moments. Variable, OFL, latin + latin-ext
         (full Turkish coverage) and bundled in public/fonts — no CDN. */
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: swap; src: url('fonts/inter-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: swap; src: url('fonts/inter-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      /* Boot splash (web/PWA only — on Android the native splash owns startup):
         white gallery wall, the ink frame mark with its indigo spark,
         an Inter wordmark with tight tracking. Near-black canvas at night,
         white mark, lighter indigo spark. */
      #boot { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: #ffffff; color: #000000; }
      [data-theme='dark'] #boot { background: #0a0a0a; color: #ffffff; }
      [data-theme='dark'] #boot svg.logo circle { fill: #8f8cff; }
      /* Before JS sets data-theme, the splash follows the system preference. */
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) #boot { background: #0a0a0a; color: #ffffff; }
        html:not([data-theme]) #boot svg.logo circle { fill: #8f8cff; }
      }
      #boot .boot-mark { display: grid; justify-items: center; gap: 14px; padding: 40px; }
      #boot svg.logo { width: 72px; height: 72px; }
      #boot .boot-name { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; font-weight: 600; font-size: 1.5rem; line-height: 1.05; letter-spacing: -0.015em; }
      #boot .boot-line { width: 56px; height: 2px; background: currentColor; opacity: 0.18; border-radius: 1px; }
      html.native #boot { display: none; }
    </style>
    <!-- Boot splash (web/PWA only — suppressed on Android, where the native launch splash stays up until the app's first frame). -->
    <div id="boot" aria-label="%BRAND_NAME%">
      <div class="boot-mark">
        %LOGO%
        <span class="boot-name">%BRAND_NAME%</span>
        <span class="boot-line" aria-hidden="true"></span>
      </div>
    </div>
    <div id="root"></div>
    <noscript>%BRAND_NAME% JavaScript gerektirir. / %BRAND_NAME% requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
