<!doctype html>
<html lang="tr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%BRAND_NAME%</title>
    <meta name="description" content="%BRAND_DESC%" />
    <meta name="theme-color" content="%THEME_LIGHT%" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="%THEME_DARK%" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="%BRAND_NAME%" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <script>
      try {
        var d = matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
      } catch (e) {}
      try {
        // Inside the Android WebView the native launch splash owns startup;
        // the PWA boot splash must never render on top of it (also set by the
        // app's main module — this early copy prevents any first-paint flash).
        if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) document.documentElement.classList.add('native');
      } catch (e) {}
    </script>
  </head>
  <body>
    <style>
      /* One voice (Threads reference): the platform system UI font — no web
         fonts to download, so first paint is immediate. Boot splash (web/PWA
         only — on Android the native splash owns startup): white paper, the
         black polaroid mark and a thin black progress sweep; #101010 in dark. */
      #boot { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: #ffffff; color: #000000; --logo-paper: #ffffff; }
      [data-theme='dark'] #boot { background: #101010; color: #f3f5f7; --logo-paper: #101010; }
      #boot .boot-mark { display: grid; justify-items: center; gap: 14px; padding: 40px; }
      #boot svg { width: 64px; height: 64px; }
      #boot .boot-name { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 1.0625rem; }
      #boot .boot-bar { width: 96px; height: 2px; background: rgb(0 0 0 / 0.08); overflow: hidden; border-radius: 1px; }
      #boot .boot-bar::after { content: ''; display: block; width: 40%; height: 100%; background: currentColor; border-radius: 1px; animation: bootsweep 1.1s ease-in-out infinite; }
      [data-theme='dark'] #boot .boot-bar { background: rgb(255 255 255 / 0.12); }
      html.native #boot { display: none; }
      @keyframes bootsweep { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
      @media (prefers-reduced-motion: reduce) { #boot .boot-bar::after { animation: none; } }
    </style>
    <!-- Boot splash (web/PWA only — suppressed on Android, where the native launch splash stays up until the app's first frame). -->
    <div id="boot" aria-label="%BRAND_NAME%">
      <div class="boot-mark">
        %LOGO%
        <span class="boot-name">%BRAND_NAME%</span>
        <span class="boot-bar"></span>
      </div>
    </div>
    <div id="root"></div>
    <noscript>%BRAND_NAME% JavaScript gerektirir. / %BRAND_NAME% requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
