<!doctype html>
<html lang="tr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%BRAND_NAME%</title>
    <meta name="description" content="%BRAND_DESC%" />
    <meta name="theme-color" content="%THEME_LIGHT%" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="%THEME_DARK%" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="%BRAND_NAME%" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <script>
      try {
        var d = matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <style>
      #boot { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: #f5f5f7; color: #1d1d1f; }
      [data-theme='dark'] #boot { background: #1d1d1f; color: #f5f5f7; }
      #boot .boot-mark { display: grid; justify-items: center; gap: 14px; padding: 40px; }
      #boot svg { width: 64px; height: 64px; }
      #boot .boot-name { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 1.4rem; letter-spacing: -0.01em; }
      #boot .boot-bar { width: 120px; height: 2px; background: rgb(29 29 31 / 0.12); overflow: hidden; border-radius: 1px; }
      #boot .boot-bar::after { content: ''; display: block; width: 40%; height: 100%; background: #0066cc; border-radius: 1px; animation: bootsweep 1.1s ease-in-out infinite; }
      [data-theme='dark'] #boot .boot-bar { background: rgb(245 245 247 / 0.14); }
      [data-theme='dark'] #boot .boot-bar::after { background: #2997ff; }
      @keyframes bootsweep { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
      @media (prefers-reduced-motion: reduce) { #boot .boot-bar::after { animation: none; } }
    </style>
    <!-- Boot splash: visible while the app and its database load, removed by the app. -->
    <div id="boot" aria-label="%BRAND_NAME%">
      <div class="boot-mark">
        %LOGO%
        <span class="boot-name">%BRAND_NAME%</span>
        <span class="boot-bar"></span>
      </div>
    </div>
    <div id="root"></div>
    <noscript>%BRAND_NAME% JavaScript gerektirir. / %BRAND_NAME% requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
