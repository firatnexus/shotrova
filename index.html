<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>%BRAND_NAME%</title>
    <meta name="description" content="%BRAND_DESC%" />
    <meta name="theme-color" content="%THEME_LIGHT%" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="%THEME_DARK%" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/inter-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      try {
        var d = matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
      } catch (e) {}
      try {
        // Inside the Android WebView the native launch splash hands off to
        // this page's launch screen (same mark and background) — the early
        // class also adjusts touch behaviour before the app module loads.
        if ((window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) || window.ShotrovaLaunch) document.documentElement.classList.add('native');
      } catch (e) {}
      try {
        // Android: where the native splash drew its icon (the window centre)
        // relative to this WebView's centre, so the launch mark below sits at
        // exactly the same spot when the splash is removed.
        var g = window.ShotrovaLaunch && String(window.ShotrovaLaunch.markOffset() || '').split(',');
        if (g && g.length === 2) {
          var rs = document.documentElement.style;
          rs.setProperty('--launch-dx', (parseFloat(g[0]) || 0) + 'px');
          rs.setProperty('--launch-dy', (parseFloat(g[1]) || 0) + 'px');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <style>
      /* One voice (Contra reference, "editorial portfolio on white"): Inter
         stands in for GT Standard — tight -0.01em tracking at 15–16px body
         sizes and large 58px display moments. Variable, OFL, latin + latin-ext
         (full Turkish coverage) and bundled in public/fonts — no CDN. */
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: swap; src: url('fonts/inter-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: swap; src: url('fonts/inter-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      /* Launch screen (web/PWA and Android): the ink frame mark with its
         indigo spark over the Shotrova wordmark — paper white by day, the
         near-black canvas at night with a white mark and lighter indigo
         spark. A restrained fade-and-scale entrance; it fades out once the
         app's first real screen has painted (App dismisses it). On Android
         the native launch splash (same mark and background) hands off to
         this screen, so startup shows one continuous composition. */
      #boot { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: #ffffff; color: #000000; }
      [data-theme='dark'] #boot { background: #0a0a0a; color: #ffffff; }
      [data-theme='dark'] #boot svg.logo circle { fill: #8f8cff; }
      /* Before JS sets data-theme, the launch screen follows the system preference. */
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) #boot { background: #0a0a0a; color: #ffffff; }
        html:not([data-theme]) #boot svg.logo circle { fill: #8f8cff; }
      }
      #boot .boot-mark { display: grid; justify-items: center; gap: 18px; padding: 40px; animation: boot-in 400ms cubic-bezier(0.16, 1, 0.3, 1) both; }
      #boot svg.logo { width: 84px; height: 84px; }
      #boot .boot-name { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; font-weight: 600; font-size: 1.6rem; line-height: 1.05; letter-spacing: -0.015em; }
      #boot.is-done { animation: boot-out 240ms ease-in both; }
      /* Android: the native splash shows this same mark at the same size
         (ic_launcher_splash*, scripts/make-icons.mjs) centred in the window.
         Here the mark itself — not mark + wordmark — is centred, shifted by
         the WebView's offset from the window centre, and holds still through
         the hand-off; the wordmark rises in beneath it once the native splash
         has been removed (main.tsx adds .is-revealed). */
      html.native #boot .boot-mark { display: block; position: relative; left: var(--launch-dx, 0px); top: var(--launch-dy, 0px); padding: 0; animation: none; }
      html.native #boot svg.logo { display: block; }
      html.native #boot .boot-name { position: absolute; left: 50%; top: calc(100% + 18px); white-space: nowrap; opacity: 0; transform: translateX(-50%); }
      html.native #boot.is-revealed .boot-name { animation: boot-name-in 320ms cubic-bezier(0.16, 1, 0.3, 1) both; }
      @keyframes boot-name-in { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }
      /* The entrance starts partly visible rather than from opacity 0, so
         that the first painted launch frame — the frame the Android splash
         hand-off reveals — already shows the mark, whatever speed the
         renderer presents frames at. */
      @keyframes boot-in { from { opacity: 0.3; transform: scale(0.94) translateY(6px); } }
      @keyframes boot-out { to { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-mark, #boot.is-done { animation: none; }
        html.native #boot.is-revealed .boot-name { animation: none; opacity: 1; }
      }
    </style>
    <!-- Launch screen: shown while the app initializes; App fades it out once
         the first real screen has painted. On Android the native launch splash
         hands off to it (same mark and background), so startup is seamless. -->
    <div id="boot" aria-label="%BRAND_NAME%">
      <div class="boot-mark">
        %LOGO%
        <span class="boot-name">%BRAND_NAME%</span>
      </div>
    </div>
    <div id="root"></div>
    <noscript>%BRAND_NAME% JavaScript gerektirir. / %BRAND_NAME% requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
