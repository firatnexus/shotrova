apply plugin: 'com.android.application'

// Single source of truth for the version: package.json (kept equal to BRAND.version
// in src/config/brand.ts by a unit test). versionCode = major*10000 + minor*100 + patch.
def pkg = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def appVersionName = pkg.version as String
def vParts = appVersionName.tokenize('.-')
def appVersionCode = (vParts[0] as Integer) * 10000 + (vParts[1] as Integer) * 100 + (vParts[2] as Integer)

// Release signing: environment variables (CI) or android/keystore.properties (local).
// Without them the release APK is built unsigned. Never commit the keystore.
def ksProps = new Properties()
def ksPropsFile = rootProject.file('keystore.properties')
if (ksPropsFile.exists()) ksPropsFile.withInputStream { ksProps.load(it) }
def signValue = { String env, String prop -> System.getenv(env) ?: ksProps.getProperty(prop) }
def releaseStore = signValue('SH_KEYSTORE_FILE', 'storeFile')

android {
    namespace "io.github.firatnexus.shotrova"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.firatnexus.shotrova"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            // `ocr-packs/` (the web build's downloadable packs) is skipped here;
            // the same files are packaged under `ocr/lang/` instead by the
            // copyOcrPacks task below, so every OCR language is built into the APK.
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!<dir>ocr-packs'
        }
    }
    androidResources {
        // OCR models (.traineddata.gz) and the WASM core are already compressed.
        noCompress += ['gz', 'wasm']
    }
    signingConfigs {
        release {
            if (releaseStore) {
                storeFile file(releaseStore)
                storePassword signValue('SH_KEYSTORE_PASSWORD', 'storePassword')
                keyAlias signValue('SH_KEY_ALIAS', 'keyAlias')
                keyPassword signValue('SH_KEY_PASSWORD', 'keyPassword')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            if (releaseStore) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Every OCR language ships inside the APK, next to Turkish + English in
// assets/public/ocr/lang, so the app never downloads language data (it used to
// fetch the ten optional packs from the web version, which is no longer
// published). The files come from public/ocr-packs, written by
// scripts/copy-ocr-assets.mjs during `npm run build`.
def ocrPacksSrc = file('../../public/ocr-packs')
def ocrPacksAssets = layout.buildDirectory.dir('generated/ocrPackAssets').get().asFile
def copyOcrPacks = tasks.register('copyOcrPacks', Copy) {
    from(ocrPacksSrc) { include '*.traineddata.gz' }
    into(new File(ocrPacksAssets, 'public/ocr/lang'))
    doFirst {
        def n = ocrPacksSrc.exists() ? ocrPacksSrc.listFiles().count { it.name.endsWith('.traineddata.gz') } : 0
        if (n < 10) throw new GradleException("Expected 10 OCR packs in ${ocrPacksSrc}, found ${n}. Run `npm run build` first.")
    }
}
android.sourceSets.main.assets.srcDirs += ocrPacksAssets
preBuild.dependsOn copyOcrPacks

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.work:work-runtime:2.10.0"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    // On-device OCR (Latin script; covers Turkish) for background analysis.
    implementation "com.google.mlkit:text-recognition:16.0.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
