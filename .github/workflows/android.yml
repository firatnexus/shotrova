name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build and test APK
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.SH_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - run: npm ci --legacy-peer-deps
      - name: Build web assets and sync them into the Android project
        run: npm run build && npx cap sync android

      - name: Restore release keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.SH_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          SH_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          SH_KEYSTORE_PASSWORD: ${{ secrets.SH_KEYSTORE_PASSWORD }}
          SH_KEY_ALIAS: ${{ secrets.SH_KEY_ALIAS }}
          SH_KEY_PASSWORD: ${{ secrets.SH_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Build debug APK (no keystore configured)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-apk
          if [ "$HAS_KEYSTORE" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist-apk/shotrova-$VERSION.apk"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "dist-apk/shotrova-$VERSION-debug.apk"
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dist-apk/*.apk
          (cd dist-apk && sha256sum *.apk > SHA256SUMS.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify signing certificate matches the last published release
        if: env.HAS_KEYSTORE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=$(ls dist-apk/*.apk)
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          NEW_FP=$($APKSIGNER verify --print-certs "$APK" | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p')
          echo "New APK signer certificate SHA-256: $NEW_FP"
          PREV_URL=$(gh api repos/${{ github.repository }}/releases/latest --jq '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -1)
          if [ -z "$PREV_URL" ]; then echo "No previous release APK found; skipping comparison."; exit 0; fi
          curl -fsSL -o /tmp/prev.apk "$PREV_URL"
          PREV_FP=$($APKSIGNER verify --print-certs /tmp/prev.apk | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p')
          echo "Previous release signer certificate SHA-256: $PREV_FP"
          if [ "$NEW_FP" != "$PREV_FP" ]; then echo "::error::Signer certificate changed - the new APK will NOT install over the old one"; exit 1; fi
          echo "OK: same signing certificate as the previous release."

      - name: APK shell E2E (web files extracted from the built APK)
        run: |
          npx playwright install --with-deps chromium
          node scripts/extract-apk-assets.mjs dist-apk/*.apk test-reports/apk-public
          npx playwright test -c playwright.android.config.ts

      - uses: actions/upload-artifact@v4
        with:
          name: shotrova-apk
          path: dist-apk/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-test-reports
          path: test-reports/e2e-android-results.json
          if-no-files-found: ignore

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Shotrova $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          gh release upload "$GITHUB_REF_NAME" dist-apk/* --clobber
