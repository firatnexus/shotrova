name: CI and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run build
      - name: Real OCR recognition (12 languages)
        run: npm run test:ocr
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Subpath build (GitHub Pages)
        run: VITE_BASE=/${{ github.event.repository.name }}/ npx vite build --outDir pages-dist
      - name: Subpath E2E
        run: PORT=4174 E2E_BASE=/${{ github.event.repository.name }}/ E2E_DIST=pages-dist E2E_JSON=test-reports/e2e-subpath.json npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            test-reports/
            test-results/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: pages-dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
